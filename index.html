<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--nar:#FF6A00;--nar-osc:#C95100;--nar-luz:#FFF3E9;--neg:#111114;--graf:#2E2E36;--hueso:#F7F7F8;--gris:#5F5F66;--linea:#E4E3E1;--ok:#1B9E5A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--hueso);color:var(--neg);line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
header{background:var(--neg);color:#fff;padding:18px 20px 16px;position:sticky;top:0;z-index:20}
.top{max-width:1500px;margin:auto;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.25rem;letter-spacing:-.04em}
.marca svg{width:32px;fill:var(--nar)} .marca i{font-style:normal;color:var(--nar)}
.marca small{display:block;font-weight:400;font-size:.72rem;color:#9A9AA6;letter-spacing:0}
.tabs{display:inline-flex;background:var(--graf);border-radius:999px;padding:3px;gap:2px}
.tab{border:0;background:none;color:#A9A9B4;padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--nar);color:#fff;font-weight:700}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--nar);outline-offset:2px}
.prog{max-width:1500px;margin:12px auto 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.barra{flex:1;min-width:180px;height:10px;background:var(--graf);border-radius:99px;overflow:hidden}
.barra>div{height:100%;background:var(--nar);width:0;transition:width .3s}
.pct{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.95rem;min-width:11ch;color:#fff}
.tools{max-width:1500px;margin:14px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input[type=search]{border:1px solid var(--linea);border-radius:999px;padding:9px 16px;min-width:220px;background:#fff}
.btn{border:0;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;background:#fff;box-shadow:inset 0 0 0 1px var(--linea);font-size:.86rem}
.btn:hover{background:var(--nar-luz)}
.sw{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--nar)}
.intro{max-width:1500px;margin:12px auto 0;padding:0 20px;color:var(--gris);font-size:.92rem}
.tablero{display:flex;gap:16px;padding:16px 20px 40px;overflow-x:auto;align-items:flex-start;max-width:100%;scroll-snap-type:x proximity}
.lista{flex:0 0 310px;background:#EDECEA;border-radius:18px;padding:12px;scroll-snap-align:start;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.lista.hecha{background:#E3F3EA}
.lh{padding:4px 6px 10px}
.lh h2{font-size:1rem;letter-spacing:-.02em;display:flex;gap:8px;justify-content:space-between;align-items:center}
.lh .ok{color:var(--ok);display:none}.lista.hecha .ok{display:inline}
.lh small{color:var(--gris);font-size:.78rem;display:block;margin-top:2px}
.mini{height:6px;background:#d6d4d0;border-radius:99px;margin-top:8px;overflow:hidden}.mini>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.cards{overflow-y:auto;display:grid;gap:9px;padding:2px;list-style:none}
.card{background:#fff;border-radius:12px;border:1px solid var(--linea);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card.done{background:#fafafa}
.cr{display:flex;gap:10px;padding:11px 12px;align-items:flex-start}
.cr input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--nar);cursor:pointer}
.cr label{cursor:pointer;font-weight:500;font-size:.92rem;flex:1}
.card.done .cr label{text-decoration:line-through;color:#8a8a93}
.etq{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 8px 42px}
.e{font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--nar-luz);color:var(--nar-osc)}
.e.f{background:#E8EEFF;color:#1b3fa8;font-family:'JetBrains Mono',monospace;text-transform:none;letter-spacing:0;font-weight:500}
.card details{border-top:1px solid var(--linea);font-size:.84rem;color:var(--gris)}
.card summary{cursor:pointer;padding:7px 12px 7px 42px;font-weight:500;color:var(--nar-osc);list-style:none}
.card summary::-webkit-details-marker{display:none}
.card summary::before{content:"+ "}.card details[open] summary::before{content:"– "}
.det{padding:0 12px 12px 42px;display:grid;gap:6px}
.det b{color:var(--neg)}
.vacio{padding:30px;text-align:center;color:var(--gris);grid-column:1/-1}
footer{padding:20px;text-align:center;font-size:.8rem;color:var(--gris)}
@media(max-width:760px){.tablero{flex-direction:column;overflow:visible}.lista{flex:none;width:100%;max-height:none}.cards{overflow:visible}}
@media print{header{position:static}.tablero{flex-wrap:wrap}.lista{max-height:none}}
</style>

const $=(s,r=document)=>r.querySelector(s);
const CLAVE=p=>"tableroMandadito.v1."+p;
function el(t,p={},...h){const n=document.createElement(t);for(const[k,v]of Object.entries(p)){if(k==="class")n.className=v;else if(k==="text")n.textContent=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else n.setAttribute(k,v)}h.flat().forEach(x=>x!=null&&n.append(x));return n}
function leer(p){try{const v=JSON.parse(localStorage.getItem(CLAVE(p))||"{}");return v&&typeof v==="object"?v:{}}catch(e){return{}}}
let avisoMostrado=false;
function guardar(p,o){try{localStorage.setItem(CLAVE(p),JSON.stringify(o))}catch(e){if(!avisoMostrado){avisoMostrado=true;alert("Este navegador no permite guardar tu progreso (modo privado o sin espacio). Podés seguir usando el tablero, pero se perderá al cerrar.")}}}

function proyecto(){return PROYECTOS.find(p=>p.id===actual)}

function pintarTabs(){
  const t=$("#tabs");t.replaceChildren(...PROYECTOS.map(p=>el("button",{class:"tab",role:"tab","aria-selected":String(p.id===actual),type:"button",text:p.nombre,onclick:()=>{actual=p.id;try{localStorage.setItem("tableroMandadito.proyecto",actual)}catch(e){}hechas=leer(actual);pintarTabs();pintar()}})));
}
function totales(){
  const P=proyecto();let t=0,h=0;P.listas.forEach(l=>l.tareas.forEach(x=>{t++;if(hechas[x[0]])h++}));return{t,h};
}
function actualizarProgreso(){
  const{t,h}=totales(),pc=t?Math.round(h*100/t):0;
  $("#pf").style.width=pc+"%";$("#pt").textContent=`${h}/${t} · ${pc}%`;$("#pb").setAttribute("aria-valuenow",pc);
  document.querySelectorAll(".lista").forEach(L=>{
    const ids=L.dataset.ids.split(","),n=ids.filter(i=>hechas[i]).length;
    L.querySelector(".mini>div").style.width=(n*100/ids.length)+"%";
    L.querySelector("small").textContent=`${n} de ${ids.length} terminadas`+(L.dataset.cap?" · "+L.dataset.cap:"");
    L.classList.toggle("hecha",n===ids.length);
  });
}
function pintar(){
  const P=proyecto(),q=norm($("#bus").value),oc=$("#ocultar").checked;
  $("#intro").textContent=P.intro;
  const cont=$("#tablero");cont.replaceChildren();
  let mostradas=0;
  P.listas.forEach(l=>{
    const lis=l.tareas.filter(x=>(!oc||!hechas[x[0]])&&(!q||norm(x.slice(1,4).join(" ")).includes(q)));
    const ul=el("ul",{class:"cards"});
    lis.forEach(([id,tit,arch,ver,etq])=>{
      mostradas++;
      const cb=el("input",{type:"checkbox",id:"c-"+id});cb.checked=!!hechas[id];
      const card=el("li",{class:"card"+(cb.checked?" done":"")});
      cb.addEventListener("change",()=>{if(cb.checked)hechas[id]=1;else delete hechas[id];guardar(actual,hechas);card.classList.toggle("done",cb.checked);actualizarProgreso();if(oc&&cb.checked)setTimeout(pintar,350)});
      card.append(el("div",{class:"cr"},cb,el("label",{for:"c-"+id,text:tit})));
      const tags=el("div",{class:"etq"},etq?el("span",{class:"e",text:etq}):null);
      if(tags.childNodes.length)card.append(tags);
      if(arch||ver)card.append(el("details",{},el("summary",{text:"Detalles"}),el("div",{class:"det"},
        arch?el("div",{},el("b",{text:"Archivos / dónde: "}),arch):null,ver?el("div",{},el("b",{text:"Cómo verificar: "}),ver):null)));
      ul.append(card);
    });
    const L=el("section",{class:"lista","data-ids":l.tareas.map(x=>x[0]).join(","),"data-cap":l.cap||"","aria-label":l.titulo},
      el("div",{class:"lh"},el("h2",{},l.titulo,el("span",{class:"ok",text:"✓ Lista completa","aria-hidden":"true"})),el("small"),el("div",{class:"mini"},el("div"))),
      lis.length?ul:el("p",{class:"vacio",text:"Sin tareas para mostrar"}));
    cont.append(L);
  });
  actualizarProgreso();
}
$("#bus").addEventListener("input",pintar);
$("#ocultar").addEventListener("change",pintar);
$("#reset").addEventListener("click",()=>{if(confirm("¿Reiniciar tu progreso de este proyecto? Se destildarán todas las tareas.")){hechas={};guardar(actual,hechas);pintar()}});
$("#imp").addEventListener("click",()=>window.print());
pintarTabs();pintar();
</script>
</body>
</html>
